# Search Dat Term compact Kitty popup.
# Add this file to your Hyprland config with:
#   source = ~/.config/hypr/sdt-popup.conf
#
# Requires current Hyprland windowrule syntax.
bind = SUPER, R, exec, sdt-popup
windowrule = match:class ^(sdt-popup)$, float on
windowrule = match:class ^(sdt-popup)$, center on
windowrule = match:class ^(sdt-popup)$, size 760 420
